# ============================================================
# DRaaC — Disaster Recovery as Code
# Round 3 (§R3.1): Portal Drift Sync — scheduled reverse-engineering of
# Azure Portal-driven resource changes back into the repo as PRs.
#
# Schedule: 02:00 UTC daily — well within the 14-day Resource Graph
# changes-table retention. Manual re-runs via `workflow_dispatch`.
#
# Two jobs (the brief's "three jobs: detect -> decompile-and-pr ->
# manual-queue-fallback" collapses to two because Sync-PortalChange.ps1
# handles both the clean-decompile -> PR path and the dirty-decompile ->
# Send-ToManualQueue.ps1 fallback inline per change):
#
#   1. detect — runs scripts/sync/Find-PortalChanges.ps1, uploads
#      portal-changes.json + skipped/summary as an artifact, sets a
#      `has-changes` job output that gates the next job.
#
#   2. sync   — downloads the detect artifact, runs
#      scripts/sync/Sync-PortalChange.ps1. Per change: az resource show ->
#      wrap as ARM -> bicep decompile (clean -> branch + PR; dirty ->
#      Send-ToManualQueue.ps1 for a `portal-sync-manual` issue).
#
# Required repository secrets (re-uses what pr-compliance.yml already needs):
#   AZURE_CLIENT_ID          — App Registration client ID (OIDC)
#   AZURE_TENANT_ID          — Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID    — primary subscription for CLI context
#   DR_TARGET_REGION         — e.g. northeurope
#   DR_VNET_ADDRESS_PREFIX   — e.g. 10.1.0.0/16
#   DR_SUBNET_ADDRESS_PREFIX — e.g. 10.1.0.0/24
#
# OIDC federation requires a `repo:<owner>/<repo>:ref:refs/heads/main`
# subject (workflow runs from the default branch on schedule). If your AAD
# app registration only has the PR-scope subject, add the main subject as
# part of Round 2's setup-github.ps1 update.
# ============================================================

name: "DRaaC Portal Drift Sync"

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      lookback-hours:
        description: "Detection window in hours (default 24)"
        required: false
        default: "24"

# Serialise: never run two portal-syncs at once — the second would race on
# the same branch names and gh pr/issue dedup.
concurrency:
  group: "draac-portal-drift-sync"
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

env:
  OUTPUT_DIR: "${{ github.workspace }}/_reports"
  RUN_ID:     "${{ github.run_id }}"
  REPO_FULL:  "${{ github.repository }}"

jobs:

  # ── Job 1: Detect portal changes ───────────────────────────────────────────
  detect:
    name: "1 · Detect portal changes"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      has-changes: ${{ steps.detect.outputs.has-changes }}
      total-kept:  ${{ steps.detect.outputs.total-kept }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Resource Graph extension
        uses: azure/cli@v2
        with:
          azcliversion: latest
          run: |
            az extension add --name resource-graph --upgrade -y

      - name: Detect via Resource Graph
        id: detect
        uses: azure/cli@v2
        with:
          azcliversion: latest
          run: |
            pwsh scripts/sync/Find-PortalChanges.ps1 \
              -OutputDir "${{ env.OUTPUT_DIR }}/sync" \
              -RunId "${{ env.RUN_ID }}" \
              -LookbackHours "${{ github.event.inputs.lookback-hours || '24' }}"
            $summary = Get-Content "${{ env.OUTPUT_DIR }}/sync/portal-changes-summary.json" -Raw | ConvertFrom-Json
            $kept = [int]$summary.totalKept
            "has-changes=$($kept -gt 0 ? 'true' : 'false')" | Out-File $env:GITHUB_OUTPUT -Append
            "total-kept=$kept"                              | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "Detect: $kept kept, $($summary.totalSkipped) skipped, $($summary.malformed) malformed."

      - name: Upload detection artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-changes
          path: ${{ env.OUTPUT_DIR }}/sync
          retention-days: 14

  # ── Job 2: Reverse-engineer to PR or manual-queue issue ────────────────────
  sync:
    name: "2 · Reverse-engineer to PR / manual-queue issue"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    permissions:
      id-token: write
      contents: write          # commit + push portal-sync branches
      pull-requests: write     # gh pr create
      issues: write            # gh issue create (manual queue)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Token + full history so Push-Branch can rebase against origin/main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        uses: azure/cli@v2
        with:
          azcliversion: latest
          run: |
            az bicep install
            az bicep upgrade

      - name: Download detection artifact
        uses: actions/download-artifact@v4
        with:
          name: portal-changes
          path: ${{ env.OUTPUT_DIR }}/sync

      - name: Reverse-engineer changes
        uses: azure/cli@v2
        with:
          azcliversion: latest
          run: |
            pwsh scripts/sync/Sync-PortalChange.ps1 \
              -ChangesFile "${{ env.OUTPUT_DIR }}/sync/portal-changes.json" \
              -RepoRoot "${{ github.workspace }}" \
              -RepoFull "${{ env.REPO_FULL }}" \
              -OutputDir "${{ env.OUTPUT_DIR }}/sync" \
              -RunId "${{ env.RUN_ID }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME:  "DRaaC Pipeline"
          GIT_AUTHOR_EMAIL: "draac-pipeline@github-actions.local"
          DR_TARGET_REGION:         ${{ secrets.DR_TARGET_REGION }}
          DR_VNET_ADDRESS_PREFIX:   ${{ secrets.DR_VNET_ADDRESS_PREFIX }}
          DR_SUBNET_ADDRESS_PREFIX: ${{ secrets.DR_SUBNET_ADDRESS_PREFIX }}

      - name: Upload sync reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-sync-reports
          path: ${{ env.OUTPUT_DIR }}/sync
          retention-days: 30
